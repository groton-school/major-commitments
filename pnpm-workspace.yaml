allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  protobufjs: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@battis/*'
  - '@groton/*'
publicHoistPattern:
  - '*prettier*'
  - '*eslint*'
  - '@commitlint/*'
  - commit-and-tag-version
packages:
  - packages/*
